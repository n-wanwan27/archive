<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3ec">
<title>ring — 結婚の資料室</title>
<style>
  :root {
    --paper: #f6f3ec;
    --ink: #282522;
    --muted: #78716a;
    --line: #d9d2c7;
    --red: #873d3b;
    --serif: "Iowan Old Style", "Palatino Linotype", "Yu Mincho", "Hiragino Mincho ProN", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  a { color: inherit; text-decoration: none; }
  .topline { height: 5px; background: var(--red); }
  header { width: min(1440px, 100%); padding: 28px clamp(22px, 6vw, 88px) 0; margin: auto; }
  .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
  .brand { display: inline-flex; align-items: center; gap: 12px; font: 22px var(--serif); letter-spacing: .12em; }
  .brand-mark { width: 24px; height: 24px; border: 1px solid var(--red); border-radius: 50%; position: relative; }
  .brand-mark::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1px solid var(--red); border-radius: 50%; top: 6px; left: 8px; }
  .nav-link { font-size: 11px; letter-spacing: .2em; color: var(--muted); }
  .hero { display: grid; grid-template-columns: 1fr auto; align-items: end; padding: clamp(56px, 9vw, 116px) 0 50px; gap: 30px; }
  .eyebrow { margin: 0 0 16px; color: var(--red); font: 11px var(--serif); letter-spacing: .28em; text-transform: uppercase; }
  h1 { margin: 0; font: 400 clamp(43px, 7vw, 88px)/1.05 var(--serif); letter-spacing: .035em; }
  .hero-jp { display: block; margin-top: 15px; font: 400 clamp(13px, 1.4vw, 17px) var(--sans); letter-spacing: .28em; color: #5e5750; }
  .count { color: var(--muted); font: 13px var(--serif); letter-spacing: .12em; padding-bottom: 7px; white-space: nowrap; }
  main { width: min(1440px, 100%); padding: 0 clamp(22px, 6vw, 88px) 100px; margin: auto; }
  .section-head { display: flex; align-items: center; gap: 18px; margin: 0 0 28px; color: var(--muted); font: 11px var(--serif); letter-spacing: .2em; }
  .section-head::after { content: ""; height: 1px; background: var(--line); flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: clamp(32px, 5vw, 74px) clamp(18px, 3vw, 44px); align-items: start; }
  .card { grid-column: span 6; min-width: 0; }
  .card:nth-child(2n) { margin-top: 95px; }
  .photo-button { appearance: none; border: 0; display: block; width: 100%; padding: 0; background: #e8e2d9; overflow: hidden; cursor: zoom-in; position: relative; }
  .photo-button::after { content: "↗"; position: absolute; right: 15px; bottom: 15px; width: 34px; height: 34px; display: grid; place-items: center; color: white; background: rgba(35,30,26,.55); border-radius: 50%; opacity: 0; transform: translateY(4px); transition: .25s ease; }
  .photo-button:hover::after, .photo-button:focus-visible::after { opacity: 1; transform: none; }
  .photo-button img { display: block; width: 100%; height: auto; transition: transform .55s cubic-bezier(.2,.7,.2,1); }
  .photo-button:hover img { transform: scale(1.018); }
  .card-meta { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding-top: 19px; }
  .number { color: var(--red); font: 12px var(--serif); letter-spacing: .08em; padding-top: 3px; }
  .name { margin: 0; font: 400 clamp(18px, 2.1vw, 25px)/1.4 var(--serif); letter-spacing: .04em; }
  .word-label { margin: 15px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .17em; }
  .word { margin: 5px 0 0; color: #5d5650; font: 14px var(--serif); }
  footer { border-top: 1px solid var(--line); text-align: center; padding: 25px 20px 32px; color: var(--muted); font: 12px var(--serif); letter-spacing: .2em; }
  .lightbox { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; padding: 28px; background: rgba(22,20,18,.94); cursor: zoom-out; }
  .lightbox.open { display: grid; }
  .lightbox img { max-width: min(100%, 1200px); max-height: 100%; object-fit: contain; box-shadow: 0 16px 70px #0008; }
  .close { position: absolute; top: 20px; right: 25px; color: white; font: 32px/1 var(--serif); background: none; border: 0; cursor: pointer; }
  @media (max-width: 650px) {
    header { padding-top: 20px; }
    .hero { grid-template-columns: 1fr; padding: 62px 0 38px; gap: 22px; }
    .count { padding: 0; }
    main { padding-bottom: 68px; }
    .grid { display: block; }
    .card, .card:nth-child(2n) { margin: 0 0 42px; }
    .photo-button::after { opacity: .85; transform: none; }
    .card-meta { padding-top: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="topline"></div>
<header>
  <nav class="nav" aria-label="メイン">
    <a class="brand" href="#top" aria-label="ring トップ"><span class="brand-mark" aria-hidden="true"></span><span>ring</span></a>
    <a class="nav-link" href="#archive">ARCHIVE&nbsp; ↘</a>
  </nav>
  <div class="hero" id="top">
    <div><p class="eyebrow">A MARRIAGE ARCHIVE</p><h1>ring<span class="hero-jp">結婚の資料室</span></h1></div>
    <div class="count">05&nbsp; / &nbsp;COLLECTION</div>
  </div>
</header>
<main id="archive">
  <h2 class="section-head"><span>COLLECTION</span><span>資料一覧</span></h2>
  <section class="grid" aria-label="資料一覧">
    <article class="card">
      <button class="photo-button" type="button" aria-label="裕太の写真を拡大"><img src="image/01.jpg" alt="ゲーム画面に登場する裕太"></button>
      <div class="card-meta"><span class="number">01</span><div><h3 class="name">裕太</h3><p class="word-label">言葉</p><p class="word">(ここに言葉)</p></div></div>
    </article>
    <article class="card">
      <button class="photo-button" type="button" aria-label="ときめきメモリアル Girl's Side 2nd Season の写真を拡大"><img src="image/02.jpg" alt="ときめきメモリアル Girl's Side 2nd Season のパッケージ"></button>
      <div class="card-meta"><span class="number">02</span><div><h3 class="name">ときめきメモリアル Girl's Side 2nd Season</h3><p class="word-label">言葉</p><p class="word">(ここに言葉)</p></div></div>
    </article>
    <article class="card">
      <button class="photo-button" type="button" aria-label="Sentido y Sensibilidad の写真を拡大"><img src="image/03.jpg" alt="映画 Sentido y Sensibilidad のポスター"></button>
      <div class="card-meta"><span class="number">03</span><div><h3 class="name">Sentido y Sensibilidad</h3><p class="word-label">言葉</p><p class="word">(ここに言葉)</p></div></div>
    </article>
    <article class="card">
      <button class="photo-button" type="button" aria-label="指輪の写真を拡大"><img src="image/04.jpg" alt="草の上で重なる手と指輪"></button>
      <div class="card-meta"><span class="number">04</span><div><h3 class="name">指輪</h3><p class="word-label">言葉</p><p class="word">(ここに言葉)</p></div></div>
    </article>
    <article class="card">
      <button class="photo-button" type="button" aria-label="柑橘の花と実の写真を拡大"><img src="image/05.jpg" alt="葉に囲まれて咲く柑橘の花と実"></button>
      <div class="card-meta"><span class="number">05</span><div><h3 class="name">柑橘の花と実</h3><p class="word-label">言葉</p><p class="word">(ここに言葉)</p></div></div>
    </article>
  </section>
</main>
<footer>ring&nbsp; · &nbsp;結婚の資料室</footer>
<div class="lightbox" role="dialog" aria-modal="true" aria-label="写真表示" tabindex="-1"><button class="close" type="button" aria-label="閉じる">×</button><img alt=""></div>
<script>
  const viewer = document.querySelector('.lightbox');
  const enlarged = viewer.querySelector('img');
  const closeButton = viewer.querySelector('.close');
  let previousFocus;
  document.querySelectorAll('.photo-button').forEach(button => {
    button.addEventListener('click', () => {
      previousFocus = button;
      enlarged.src = button.querySelector('img').src;
      enlarged.alt = button.querySelector('img').alt;
      viewer.classList.add('open');
      document.body.style.overflow = 'hidden';
      closeButton.focus();
    });
  });
  function closeViewer() {
    viewer.classList.remove('open');
    document.body.style.overflow = '';
    if (previousFocus) previousFocus.focus();
  }
  closeButton.addEventListener('click', closeViewer);
  viewer.addEventListener('click', event => { if (event.target === viewer) closeViewer(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && viewer.classList.contains('open')) closeViewer(); });
</script>
</body>
</html>
